# Enable ZMK Studio with locking disabled (no unlock button press required)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Identification
CONFIG_ZMK_KEYBOARD_NAME="Edin Keyboard"
CONFIG_USB_DEVICE_PRODUCT="Edin Keyboard"
CONFIG_USB_DEVICE_MANUFACTURER="Custom"
CONFIG_USB_DEVICE_PID=0x8888

# Flash storage for ZMK Studio settings persistence
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
